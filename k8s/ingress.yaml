apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashew-frontend-ingress
  namespace: cashew-capital
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cashew-backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cashew-frontend
                port:
                  number: 3000