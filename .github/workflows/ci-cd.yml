name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # BUILD + TEST — Frontend
  # ─────────────────────────────────────────────
  build-and-test-frontend:
    name: Build & Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # BUILD + TEST — Backend
  # ─────────────────────────────────────────────
  build-and-test-backend:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build (if applicable)
        run: npm run build --if-present

  # ─────────────────────────────────────────────
  # DOCKER IMAGE BUILD — only after both pass
  # ─────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    needs: [build-and-test-frontend, build-and-test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t cashew-frontend:${{ github.sha }} ./frontend

      - name: Build backend image
        run: docker build -t cashew-backend:${{ github.sha }} ./backend

  # ─────────────────────────────────────────────
  # DEPLOY — only on push to main, only if
  # everything above succeeded
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2/k3s
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No AWS credential setup needed — this runner IS the EC2 instance,
      # which already has an IAM role attached (see cashew-capital-ec2-ecr-role)

      - name: Log in to Amazon ECR
        id: ecr-login
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 852845752811.dkr.ecr.us-east-1.amazonaws.com

      - name: Build, tag, and push frontend image
        run: |
          docker build -t 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:${{ github.sha }} ./frontend
          docker build -t 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:latest ./frontend
          docker push 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:${{ github.sha }}
          docker push 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:latest

      - name: Build, tag, and push backend image
        run: |
          docker build -t 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:${{ github.sha }} ./backend
          docker build -t 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:latest ./backend
          docker push 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:${{ github.sha }}
          docker push 852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:latest

      # No kubeconfig secret needed either — kubectl already works locally
      # on this instance, pointed at its own k3s cluster

      - name: Refresh ECR pull secret
        run: |
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=852845752811.dkr.ecr.us-east-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region us-east-1) \
            --namespace=cashew-capital \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to cluster
        run: |
          kubectl set image deployment/cashew-frontend \
            cashew-frontend=852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:${{ github.sha }} \
            -n cashew-capital
          kubectl set image deployment/cashew-backend \
            cashew-backend=852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:${{ github.sha }} \
            -n cashew-capital
          kubectl rollout status deployment/cashew-frontend -n cashew-capital
          kubectl rollout status deployment/cashew-backend -n cashew-capital