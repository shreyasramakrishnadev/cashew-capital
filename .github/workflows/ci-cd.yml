name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # BUILD + TEST — Frontend
  # ─────────────────────────────────────────────
  build-and-test-frontend:
    name: Build & Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # BUILD + TEST — Backend
  # ─────────────────────────────────────────────
  build-and-test-backend:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build (if applicable)
        run: npm run build --if-present

  # ─────────────────────────────────────────────
  # DOCKER IMAGE BUILD — only after both pass
  # ─────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    needs: [build-and-test-frontend, build-and-test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t cashew-frontend:${{ github.sha }} ./frontend

      - name: Build backend image
        run: docker build -t cashew-backend:${{ github.sha }} ./backend

  # ─────────────────────────────────────────────
  # DEPLOY — only on push to main, only if
  # everything above succeeded
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to ECR
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/cashew-frontend:${{ github.sha }} ./frontend
          docker build -t $ECR_REGISTRY/cashew-frontend:latest ./frontend
          docker push $ECR_REGISTRY/cashew-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/cashew-frontend:latest

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/cashew-backend:${{ github.sha }} ./backend
          docker build -t $ECR_REGISTRY/cashew-backend:latest ./backend
          docker push $ECR_REGISTRY/cashew-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/cashew-backend:latest

  deploy:
    name: Deploy to EC2/k3s
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No Docker builds here anymore — images are already in ECR,
      # built on GitHub's cloud runners. This job only talks to
      # the local k3s cluster, keeping load on this box minimal.

      - name: Refresh ECR pull secret
        run: |
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=852845752811.dkr.ecr.us-east-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region us-east-1) \
            --namespace=cashew-capital \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy to cluster
        run: |
          kubectl set image deployment/cashew-frontend \
            cashew-frontend=852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-frontend:${{ github.sha }} \
            -n cashew-capital
          kubectl set image deployment/cashew-backend \
            cashew-backend=852845752811.dkr.ecr.us-east-1.amazonaws.com/cashew-backend:${{ github.sha }} \
            -n cashew-capital
          kubectl rollout status deployment/cashew-frontend -n cashew-capital
          kubectl rollout status deployment/cashew-backend -n cashew-capital
